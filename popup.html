<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paramount 双语字幕</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">
          <span class="wave wave--1"></span>
          <span class="wave wave--2"></span>
          <span class="wave wave--3"></span>
          <span class="wave wave--4"></span>
          <span class="wave wave--5"></span>
        </div>
        <h1>Paramount 双语字幕</h1>
        <button class="icon-button" id="settings-shortcut" type="button" aria-label="字幕设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2Z"/>
            <path d="M19.4 13.5a7.8 7.8 0 0 0 .05-3l1.75-1.34-2-3.46-2.18.9a8 8 0 0 0-2.58-1.5L14.1 2.8h-4l-.34 2.3a8 8 0 0 0-2.58 1.5L5 5.7 3 9.16l1.75 1.34a7.8 7.8 0 0 0 .05 3L3 14.84l2 3.46 2.24-.92a8 8 0 0 0 2.52 1.45l.34 2.37h4l.34-2.37a8 8 0 0 0 2.52-1.45l2.24.92 2-3.46-1.8-1.34Z"/>
          </svg>
        </button>
      </header>

      <div class="connection" id="connection" data-state="checking">
        <span class="connection__dot"></span>
        <span class="connection__text">正在连接 Paramount+…</span>
      </div>

      <section class="primary-control" aria-label="插件总开关">
        <label class="enable-row" for="enabled">
          <span>启用字幕助手</span>
          <span class="switch">
            <input id="enabled" type="checkbox">
            <span class="switch__track"><span class="switch__thumb"></span></span>
          </span>
        </label>
        <div class="segmented" role="group" aria-label="字幕显示模式">
          <button type="button" data-mode="bilingual">双语</button>
          <button type="button" data-mode="chinese">仅中文</button>
          <button type="button" data-mode="english">仅英文</button>
        </div>
      </section>

      <section class="settings-section" aria-labelledby="translation-title">
        <h2 id="translation-title">翻译</h2>
        <div class="setting-row setting-row--static">
          <span>源语言</span><strong>English</strong>
        </div>
        <div class="setting-row setting-row--static">
          <span>目标语言</span><strong>简体中文</strong>
        </div>
        <label class="setting-row" for="engine">
          <span>翻译引擎</span>
          <span class="select-wrap">
            <select id="engine">
              <option value="local">Chrome 本地</option>
              <option value="google">Google 备用</option>
            </select>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
          </span>
        </label>
        <p class="engine-note" id="engine-note">字幕留在设备上；首次播放交互时自动准备语言包。</p>
      </section>

      <section class="settings-section settings-section--style" id="style-settings" aria-labelledby="style-title">
        <h2 id="style-title">字幕样式</h2>
        <div class="setting-row">
          <span>字号</span>
          <div class="stepper" role="group" aria-label="字幕字号">
            <button id="font-decrease" type="button" aria-label="减小字号">−</button>
            <output id="font-size">28</output>
            <button id="font-increase" type="button" aria-label="增大字号">＋</button>
          </div>
        </div>
        <label class="setting-row setting-row--slider" for="background-opacity">
          <span>背景</span>
          <span class="range-wrap">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5S4.5 8.6 4.5 12.2a5.5 5.5 0 0 0 11 0C15.5 8.6 10 2.5 10 2.5Z"/></svg>
            <input id="background-opacity" type="range" min="0" max="0.8" step="0.05">
            <output id="background-value">45%</output>
          </span>
        </label>
        <div class="setting-row">
          <span>位置</span>
          <div class="position-control" role="group" aria-label="字幕位置">
            <button id="position-up" type="button" aria-label="字幕上移">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 12 6-6 6 6M10 6v9"/></svg>
            </button>
            <button id="position-down" type="button" aria-label="字幕下移">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 8 6 6 6-6M10 14V5"/></svg>
            </button>
          </div>
        </div>
        <div class="setting-row">
          <span title="找不到上一句精确时间时使用">回看兜底</span>
          <div class="stepper" role="group" aria-label="回看兜底秒数">
            <button id="rewind-decrease" type="button" aria-label="减少回退秒数">−</button>
            <output id="rewind-seconds">5秒</output>
            <button id="rewind-increase" type="button" aria-label="增加回退秒数">＋</button>
          </div>
        </div>
      </section>

      <label class="learning-row learning-row--featured" for="learning-hints">
        <span>
          高难词辅助 <em>进阶</em>
          <small>逐词高亮难词，并在词下显示简短翻译</small>
        </span>
        <span class="switch switch--small">
          <input id="learning-hints" type="checkbox">
          <span class="switch__track"><span class="switch__thumb"></span></span>
        </span>
      </label>

      <label class="learning-row" for="hover-dictionary">
        <span>
          鼠标悬停查词
          <small>悬停字幕时自动暂停，移开后继续播放</small>
        </span>
        <span class="switch switch--small">
          <input id="hover-dictionary" type="checkbox">
          <span class="switch__track"><span class="switch__thumb"></span></span>
        </span>
      </label>

      <label class="learning-row learning-row--compact" for="debug-toast">
        <span>
          显示运行状态
          <small>默认关闭；需要排查字幕或翻译问题时开启</small>
        </span>
        <span class="switch switch--small">
          <input id="debug-toast" type="checkbox">
          <span class="switch__track"><span class="switch__thumb"></span></span>
        </span>
      </label>

      <button class="reset-placement" id="reset-placements" type="button">恢复字幕与状态块默认位置</button>

      <footer class="app-footer">
        <div class="app-footer__actions">
          <button id="open-vocabulary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Zm0 12h10M9 8h5"/></svg>
            单词本
          </button>
          <button id="open-debug" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5-6 7 6 7M16 5l6 7-6 7M14 2 10 22"/></svg>
            调试
          </button>
        </div>
        <span>v0.4.0</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
