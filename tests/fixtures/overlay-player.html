<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Engram player-bound overlay QA</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; background: #0f0f0f; color: #fff; font-family: system-ui, sans-serif; }
      .toolbar { display: flex; gap: 10px; padding: 14px 24px; }
      button { padding: 8px 13px; border: 0; border-radius: 8px; font: inherit; cursor: pointer; }
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; padding: 0 24px; }
      body[data-wide="true"] .layout { grid-template-columns: minmax(0, 1fr); }
      body[data-wide="true"] aside { display: none; }
      .player {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background:
          radial-gradient(circle at 48% 46%, #b8c7b4 0 8%, transparent 9%),
          linear-gradient(135deg, #b9d1d2 0 38%, #5a806e 39% 64%, #294437 65%);
      }
      .player::before { content: "YouTube player mock"; position: absolute; top: 16px; left: 18px; opacity: 0.72; }
      .player::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 13px; height: 4px; background: linear-gradient(90deg, #f00 0 36%, #777 36%); }
      video { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
      aside { display: grid; align-content: start; gap: 12px; }
      aside span { display: block; height: 92px; border-radius: 10px; background: #252525; }
      .comments { min-height: 900px; margin: 28px 24px; padding: 24px; border-radius: 14px; background: #171717; }
      .comments p { max-width: 780px; padding: 18px; border-bottom: 1px solid #333; color: #ddd; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="toggle-layout" type="button">Toggle theater layout</button>
      <button id="next-cue" type="button">Show pending translation</button>
      <button id="show-comments" type="button">Scroll to comments</button>
      <button id="auto-sentence" type="button">Render complete auto-caption sentence</button>
    </div>
    <div class="layout">
      <main class="player">
        <video></video>
      </main>
      <aside aria-label="Recommendations"><span></span><span></span><span></span></aside>
    </div>
    <section class="comments" id="comments">
      <h2>Comments</h2>
      <p>The subtitle overlay must not appear here after the video leaves the viewport.</p>
      <p>Recommendations and comments remain available.</p>
    </section>
    <script src="../../src/namespace.js"></script>
    <script src="../../src/i18n.js"></script>
    <script src="../../src/settings.js"></script>
    <script src="../../src/capture.js"></script>
    <script src="../../src/overlay.js"></script>
    <script>
      const PST = globalThis.ParamountSubtitles;
      const overlay = new PST.SubtitleOverlay({ lookup: async () => null });
      const initialCue = {
        text: "Do you actually know your real English level?",
        translation: "你真的了解自己的英语水平吗？",
        source: "YouTube JSON3",
      };
      overlay.mount();
      overlay.updateSettings({ ...PST.DEFAULT_SETTINGS, mode: "bilingual", fontSize: 28, position: 13 });
      overlay.setCue(initialCue);
      document.querySelector("#toggle-layout").addEventListener("click", () => {
        document.body.dataset.wide = String(document.body.dataset.wide !== "true");
      });
      document.querySelector("#next-cue").addEventListener("click", () => {
        overlay.setCue({ ...initialCue, translation: "" });
        setTimeout(() => overlay.setCue(initialCue), 450);
      });
      document.querySelector("#show-comments").addEventListener("click", () => {
        document.querySelector("#comments").scrollIntoView();
      });
      document.querySelector("#auto-sentence").addEventListener("click", () => {
        const words = [
          "It's", "a", "bit", "embarrassing", "to", "admit,", "but", "in", "cybersecurity,",
          "the", "small", "gaps", "are", "often", "the", "most", "dangerous", "ones.",
        ];
        const cues = PST.aggregateYouTubeAutoCues(words.map((text, index) => ({
          start: index * 0.65,
          end: (index * 0.65) + 1.1,
          text,
        })));
        overlay.setCue({
          text: cues[0].text,
          translation: "说来有点尴尬，但在网络安全领域，小缺口往往才是最危险的。",
          source: "YouTube Auto",
        });
        document.body.dataset.autoSentenceCount = String(cues.length);
      });
      globalThis.qaOverlay = overlay;
    </script>
  </body>
</html>
